name: Import two verified mobile-robot CAD chassis
on:
  push:
    branches:
      - feature/cad-assets-and-command-center-v2
    paths:
      - '.github/workflows/import-approved-cad.yml'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  licensed-cad:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated mesh optimizer
        run: python -m pip install --disable-pip-version-check trimesh==4.8.3 fast-simplification==0.1.12
      - name: Import upstream STL bodies, verify immutable Git blob digests, simplify
        run: |
          python - <<'PY'
          import hashlib
          from io import BytesIO
          from pathlib import Path
          from urllib.request import urlopen
          import numpy as np
          import trimesh
          import fast_simplification

          source=[
            ("https://raw.githubusercontent.com/rlxai/rbot/main/src/robot/rlai_meshes/meshes/chassis.stl",
             "6102c3f459b8d915b1f7e30719d6873f7f38c5ce",
             "dashboard/assets/robot/rbot-chassis.stl"),
            ("https://raw.githubusercontent.com/mohmedatwa/delivery_robot/main/delivery_description/meshes/base_link.STL",
             "69b4b8b19df4cee62474ad7bcc57337dd46435ef",
             "dashboard/assets/robot/mecanum-chassis.stl"),
          ]
          for url,sha,destination in source:
            with urlopen(url, timeout=55) as response:
              raw=response.read(7_000_000)
            digest=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\x00'+raw).hexdigest()
            if digest!=sha:
              raise RuntimeError(f'Upstream CAD source digest mismatch: {url}')
            mesh=trimesh.load(BytesIO(raw),file_type='stl',force='mesh')
            if len(mesh.faces)<500:
              raise RuntimeError('Upstream source not a detailed triangulated body')
            vertices, faces=fast_simplification.simplify(
              np.asarray(mesh.vertices,dtype=np.float64),
              np.asarray(mesh.faces,dtype=np.int32),
              target_count=min(len(mesh.faces),6400))
            result=trimesh.Trimesh(vertices=vertices,faces=faces,process=False)
            result.remove_unreferenced_vertices()
            out=Path(destination);out.parent.mkdir(parents=True,exist_ok=True)
            out.write_bytes(result.export(file_type='stl'))
            print(f'{out}: original triangles={len(mesh.faces)} optimized={len(result.faces)} size={out.stat().st_size} bytes')
            if not 3000 <= len(result.faces) <= 7000:
              raise RuntimeError('CAD simplification failed target face count')
          PY
      - name: Commit only two derived CAD mesh assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/assets/robot/rbot-chassis.stl dashboard/assets/robot/mecanum-chassis.stl
          if git diff --cached --quiet; then
            echo 'Verified CAD meshes already imported'
          else
            git commit -m "assets: import licensed optimized robot chassis from pinned upstream source blobs"
            git push origin HEAD:feature/cad-assets-and-command-center-v2
          fi
