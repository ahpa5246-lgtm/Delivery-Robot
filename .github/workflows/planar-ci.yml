name: Planar simulator verification
on:
  push:
    paths:
      - 'cdr_sim/**'
      - 'dashboard/**'
      - 'world/**'
      - 'scripts/serve_dashboard.py'
      - 'scripts/run_campus_demo.py'
      - 'tests/**'
      - 'scripts/run_benchmark.py'
      - '.github/workflows/planar-ci.yml'
  pull_request:
    paths:
      - 'cdr_sim/**'
      - 'tests/**'
      - 'scripts/run_benchmark.py'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  planar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned MCAP test dependency
        run: python -m pip install -r requirements-telemetry.txt
      - name: Unit and regression tests
        run: python -m unittest discover -s tests -v
      - name: Campus replay and dashboard assets smoke
        run: |
          python scripts/run_campus_demo.py --seed 7 --scenario construction --output experiments/ci_campus.json
          for script in dashboard/app.js dashboard/scene3d.js dashboard/cad-enhancement.js dashboard/analytics.js dashboard/environment-detail.js dashboard/engineering-audit.js dashboard/collision-debug.js dashboard/garden-splat.js dashboard/robot-garden.js; do node --check "$script"; done
          python -m py_compile scripts/run_campus_demo.py scripts/serve_dashboard.py cdr_sim/campus.py
      - name: Execute 100-seed simulation baseline
        run: |
          python scripts/run_benchmark.py --count 100 --output experiments/ci_baseline
          python -c "import json; from pathlib import Path; p=json.loads(Path('experiments/ci_baseline/summary.json').read_text()); assert p['completed']==100 and p['collision_samples_total']==0, p"
      - name: Execute 1000-seed stress trial and preserve raw output
        run: |
          python scripts/run_benchmark.py --count 1000 --output experiments/ci_stress
          python -c "import json; from pathlib import Path; p=json.loads(Path('experiments/ci_stress/summary.json').read_text()); assert p['completed']==1000 and p['collision_samples_total']==0, p"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planar-execution-results
          path: |
            experiments/ci_campus.json
            experiments/ci_baseline/
            experiments/ci_stress/
