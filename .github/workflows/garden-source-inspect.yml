name: Inspect public Gaussian Garden source URLs
on:
  push:
    branches: [feature/real-garden-robot-simulation]
    paths:
      - 'scripts/discover_public_garden.mjs'
      - '.github/workflows/garden-source-inspect.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node scripts/discover_public_garden.mjs
