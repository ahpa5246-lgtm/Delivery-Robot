name: Gazebo Harmonic headless smoke
on:
  push:
    paths:
      - 'scripts/generate_gazebo_world.py'
      - 'scripts/generate_campus_gazebo.py'
      - 'cdr_sim/campus.py'
      - 'cdr_sim/closed_loop.py'
      - 'scripts/check_gazebo_collision.py'
      - 'scripts/gazebo_contact_trigger.py'
      - 'tests/test_gazebo_contact.py'
      - 'scripts/export_gazebo_observation.py'
      - 'tests/test_gazebo_observation.py'
      - 'world/campus_layout.json'
      - 'tests/test_campus_world.py'
      - 'tests/test_gazebo_geometry.py'
      - '.github/workflows/gazebo-headless.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gazebo-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Generate and statically validate SDF
        run: |
          python3 scripts/generate_gazebo_world.py
          python3 scripts/generate_campus_gazebo.py
          python3 -m unittest discover -s tests -p 'test_gazebo_geometry.py' -v
          python3 -m unittest discover -s tests -p 'test_gazebo_contact.py' -v
          mkdir -p experiments/gazebo_smoke
      - name: Install ROS Jazzy Gazebo integration in ephemeral container and run headless
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" ros:jazzy-ros-base bash -e -o pipefail -c '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ros-jazzy-ros-gz
            source /opt/ros/jazzy/setup.bash
            gz sim --versions | tee /work/experiments/gazebo_smoke/gz_version.txt
            gz sdf -k /work/simulation/campus_v0.sdf > /work/experiments/gazebo_smoke/sdf_validation.txt 2>&1
            gz sdf -k /work/simulation/campus_delivery.sdf > /work/experiments/gazebo_smoke/campus_sdf_validation.txt 2>&1
            gz sdf -k /work/simulation/warehouse_delivery.sdf > /work/experiments/gazebo_smoke/warehouse_sdf_validation.txt 2>&1
            gz sdf -k /work/simulation/warehouse_collision_test.sdf > /work/experiments/gazebo_smoke/warehouse_contact_sdf_validation.txt 2>&1
            gz sim -s -r -v 3 /work/simulation/campus_v0.sdf > /work/experiments/gazebo_smoke/server.log 2>&1 &
            server_pid=$!
            trap "kill $server_pid 2>/dev/null || true" EXIT
            sleep 10
            gz topic -l > /work/experiments/gazebo_smoke/topics.txt
            grep -F "/model/cdr01/odometry" /work/experiments/gazebo_smoke/topics.txt
            timeout 7 gz topic -e -t /model/cdr01/odometry > /work/experiments/gazebo_smoke/odometry.txt 2>&1 || true
            test -s /work/experiments/gazebo_smoke/odometry.txt
            grep -Eq "pose|twist|header" /work/experiments/gazebo_smoke/odometry.txt
            echo "PASS: actual Gazebo headless odometry topic observed" > /work/experiments/gazebo_smoke/outcome.txt
            timeout 20 gz topic -e -t /model/cdr01/odometry > /work/experiments/gazebo_smoke/odometry_motion.txt 2>&1 &
            motion_log_pid=$!
            sleep 1
            for i in $(seq 1 50); do
              gz topic -t /model/cdr01/cmd_vel -m gz.msgs.Twist -p "linear: {x: 0.25}" >/dev/null 2>&1
              sleep 0.1
            done
            wait $motion_log_pid || true
            python3 /work/scripts/check_gazebo_motion.py /work/experiments/gazebo_smoke/odometry_motion.txt /work/experiments/gazebo_smoke/motion_summary.json
            echo "PASS: measured displacement in Gazebo model after velocity command" >> /work/experiments/gazebo_smoke/outcome.txt
            ros2 launch ros_gz_bridge ros_gz_bridge.launch.py bridge_name:=cdr01_bridge config_file:=/work/simulation/ros_gz_bridge.yaml > /work/experiments/gazebo_smoke/ros_bridge.log 2>&1 &
            bridge_pid=$!
            sleep 5
            # Discovery is asynchronous: do not misdiagnose a working bridge
            # because its ROS graph takes more than five seconds to appear.
            for attempt in $(seq 1 30); do
              ros2 topic list > /work/experiments/gazebo_smoke/ros_topics.txt
              if grep -Fxq "/robot1/odom" /work/experiments/gazebo_smoke/ros_topics.txt; then break; fi
              sleep 1
            done
            grep -Fx "/robot1/odom" /work/experiments/gazebo_smoke/ros_topics.txt
            timeout 12 ros2 topic echo --once /robot1/odom > /work/experiments/gazebo_smoke/ros_odometry.txt 2>&1 || true
            test -s /work/experiments/gazebo_smoke/ros_odometry.txt
            grep -q "pose:" /work/experiments/gazebo_smoke/ros_odometry.txt
            echo "PASS: Gazebo odometry bridged into ROS2 /robot1/odom" >> /work/experiments/gazebo_smoke/outcome.txt
            python3 /work/scripts/ros_velocity_watchdog.py > /work/experiments/gazebo_smoke/watchdog.log 2>&1 &
            watchdog_pid=$!
            sleep 3
            python3 /work/scripts/verify_ros_watchdog_live.py > /work/experiments/gazebo_smoke/watchdog_acceptance.json
            kill $watchdog_pid 2>/dev/null || true
            kill $bridge_pid 2>/dev/null || true
            echo "PASS: ROS2 watchdog relays motion and auto-stops Gazebo on command timeout" >> /work/experiments/gazebo_smoke/outcome.txt
            # Physical wall challenge using the EXACT manifest-derived SDF
            # collision geometry, not the 2-D analytical surrogate.
            for theme in campus warehouse; do
              export GZ_PARTITION="cdr_collision_${theme}"
              world_file="/work/simulation/${theme}_delivery.sdf"
              if [ "$theme" = "warehouse" ]; then
                world_file="/work/simulation/warehouse_collision_test.sdf"
              fi
              gz sim -s -r -v 2 "$world_file" > "/work/experiments/gazebo_smoke/${theme}_server.log" 2>&1 &
              collision_server=$!
              sleep 10
              gz topic -l | grep -F "/model/cdr01/odometry"
              # SceneBroadcaster reports actual rigid-body poses; DiffDrive
              # odometry alone can continue advancing during wheel slip.
              pose_topic="/world/campus_test/pose/info"
              gz topic -l | grep -Fx "$pose_topic"
              timeout 50 gz topic -e -t "$pose_topic" > "/work/experiments/gazebo_smoke/${theme}_world_pose.txt" 2>&1 &
              pose_observer=$!
              timeout 50 gz topic -e -t /model/cdr01/odometry > "/work/experiments/gazebo_smoke/${theme}_collision_odom.txt" 2>&1 &
              observer=$!
              # This is a finite wall challenge, not a command to grind the
              # differential-drive wheels into a wall for 50 seconds. On the
              # previous run contact happened near t+12s; prolonged pushing
              # caused yaw drift and eventually drove the robot off pavement.
              # Observe *actual* Pose_V in parallel and stop once the body
              # reaches the wall. A missing trigger is a hard failure.
              contact_reached=0
              for i in $(seq 1 230); do
                gz topic -t /model/cdr01/cmd_vel -m gz.msgs.Twist -p "linear: {x: 0.65}" \
                  >> "/work/experiments/gazebo_smoke/${theme}_commands.log" 2>&1
                sleep 0.1
                if [ $((i % 5)) -eq 0 ] && python3 /work/scripts/gazebo_contact_trigger.py \
                  "/work/experiments/gazebo_smoke/${theme}_world_pose.txt" --world "$theme"; then
                  contact_reached=1
                  break
                fi
              done
              if [ "$contact_reached" -ne 1 ]; then
                echo "FAIL: ${theme} chassis never reached SDF wall contact" >&2
                exit 1
              fi
              # Short positive command tests collision resistance. Then zero
              # velocity requests remove wall pressure and prevent side slip.
              for i in $(seq 1 4); do
                gz topic -t /model/cdr01/cmd_vel -m gz.msgs.Twist -p "linear: {x: 0.65}" >/dev/null 2>&1
                sleep 0.1
              done
              for i in $(seq 1 30); do
                gz topic -t /model/cdr01/cmd_vel -m gz.msgs.Twist -p "linear: {x: 0}" >/dev/null 2>&1
                sleep 0.1
              done
              sleep 2
              kill $observer 2>/dev/null || true
              kill $pose_observer 2>/dev/null || true
              wait $observer 2>/dev/null || true
              wait $pose_observer 2>/dev/null || true
              kill $collision_server 2>/dev/null || true
              wait $collision_server 2>/dev/null || true
              python3 /work/scripts/check_gazebo_collision.py                 "/work/experiments/gazebo_smoke/${theme}_collision_odom.txt"                 "/work/experiments/gazebo_smoke/${theme}_collision_summary.json" --world "$theme" \
                --pose-file "/work/experiments/gazebo_smoke/${theme}_world_pose.txt"
              echo "PASS: ${theme} SDF robot physically blocked by building_0" >> /work/experiments/gazebo_smoke/outcome.txt
            done
          '
      - name: Convert validated Gazebo physics observations to indexed MCAP
        run: |
          python3 -m pip install -r requirements-telemetry.txt
          python3 -m unittest discover -s tests -p 'test_gazebo_observation.py' -v
          for theme in campus warehouse; do
            python3 scripts/export_gazebo_observation.py \
              --world "$theme" \
              --input "experiments/gazebo_smoke/${theme}_collision_odom.txt" \
              --pose-input "experiments/gazebo_smoke/${theme}_world_pose.txt" \
              --output "experiments/gazebo_smoke/${theme}_gazebo_verified.mcap"
          done
      - name: Upload actual Gazebo startup and observation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gazebo-harmonic-headless-smoke
          path: experiments/gazebo_smoke/
